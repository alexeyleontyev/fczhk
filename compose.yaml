name: fczhk
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fczhk
      POSTGRES_DB: fczhk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fczhk -d fczhk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    profiles: [production]
    image: ${FCZHK_IMAGE:-fczhk:local}
    env_file: .env
    command: ["/app/.venv/bin/fczhk", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    profiles: [production]
    image: ${FCZHK_IMAGE:-fczhk:local}
    env_file: .env
    environment:
      # Port 8000 is accessible only inside Docker; Caddy sanitizes X-Forwarded-For.
      FCZHK_FORWARDED_ALLOW_IPS: "*"
    command: ["/app/.venv/bin/fczhk", "serve"]
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    profiles: [production]
    image: ${FCZHK_IMAGE:-fczhk:local}
    env_file: .env
    command: ["/app/.venv/bin/fczhk", "worker"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/fczhk", "worker-health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  bot:
    profiles: [polling]
    image: ${FCZHK_IMAGE:-fczhk:local}
    env_file: .env
    command: ["/app/.venv/bin/fczhk", "bot"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tools:
    profiles: [tools]
    image: ${FCZHK_IMAGE:-fczhk:local}
    env_file: .env
    command: ["/app/.venv/bin/fczhk", "check-bot"]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    profiles: [production]
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:

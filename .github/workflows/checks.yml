name: MVP 1–5 checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fczhk
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: fczhk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fczhk -d fczhk"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check src tests migrations scripts
      - run: uv run pytest -q
        env:
          FCZHK_TEST_DATABASE_URL: postgresql+psycopg://fczhk:ci-only@localhost:5432/fczhk
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e

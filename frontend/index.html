<!doctype html>
<html lang="ru" class="club-launching">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4eb" />
    <meta
      name="description"
      content="ФКЖК — футбол по пятницам: запись на игры, составы, результаты, рейтинги и прогнозы для участников сообщества."
    />
    <title>ФКЖК — футбол по пятницам</title>
    <link rel="icon" href="/assets/club/crest.svg" type="image/svg+xml" />
    <style>
      html.club-launching {
        overflow: hidden;
      }
      #root[inert] {
        visibility: hidden;
      }
      .club-launch {
        /* Match protocol.css + atlas.css before the application CSS arrives. */
        --launch-paper: var(--paper, #f7f4eb);
        --launch-ink: var(--ink, #1d211c);
        --launch-sun: var(--sun, #ffd900);
        --launch-muted: var(--muted, #53594f);
        --launch-line: var(--line, #b4b6a8);
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 16px;
        overflow: auto;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        background: var(--launch-paper);
        color: var(--launch-ink);
        text-align: center;
        font:
          600 18px/1.35 system-ui,
          sans-serif;
        font-optical-sizing: auto;
      }
      .club-launch-flight {
        width: min(100%, 520px, calc((100svh - 160px) * 0.945));
      }
      .club-launch-scene,
      .club-launch-beer {
        display: block;
        width: 100%;
        height: auto;
      }
      .club-launch-beer-entrance {
        opacity: 0;
        visibility: hidden;
      }
      .club-launch-beer {
        transform: scale(0.85);
        transform-origin: 50% 100%;
        overflow: visible;
      }
      .club-launch-confetti-scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
      .club-launch-drone {
        transform-origin: 140px 180px;
      }
      .club-launch-ball {
        transform: translate(206px, 232px);
      }
      .club-launch-goal {
        opacity: 0;
      }
      .club-launch-bottle-foam,
      .club-launch-bottle-halo,
      .club-launch-confetti {
        opacity: 0;
      }
      .club-launch p {
        margin: 0;
        color: var(--launch-muted);
        font-size: 15px;
        font-weight: 500;
      }
      .club-launch[hidden],
      .club-launch [hidden] {
        display: none;
      }
      .club-launch-actions {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        min-height: 54px;
      }
      .club-launch button {
        cursor: pointer;
        font: inherit;
        color: var(--launch-ink);
        background: var(--launch-paper);
        min-height: 54px;
        padding: 12px 28px;
        border: 1px solid var(--launch-line);
        border-radius: var(--radius-control, 0.4rem);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
          background-color 120ms ease-out;
      }
      .club-launch .club-launch-open {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-width: 184px;
        border-color: var(--launch-ink);
        color: var(--launch-ink);
        background: var(--launch-sun);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.015em;
        animation: launch-open-appear 220ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }
      .club-launch .club-launch-open[hidden] {
        display: none;
      }
      .club-launch button:not(:disabled):active {
        scale: 1;
        filter: none;
        transform: scale(0.97);
        transition-duration: 80ms;
      }
      .club-launch button:focus-visible {
        outline: 2px solid var(--launch-ink);
        outline-offset: 4px;
      }
      @media (hover: hover) {
        .club-launch-open:hover {
          background: #f3ce00;
        }
      }
      .club-launch .club-launch-open:active {
        background: #e8c500;
      }
      @keyframes launch-open-appear {
        from {
          opacity: 0;
          translate: 0 5px;
        }
        to {
          opacity: 1;
          translate: 0 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .club-launch button,
        .club-launch .club-launch-open {
          animation: none;
          transition: none;
        }
        .club-launch button:not(:disabled):active {
          transform: none;
        }
      }
    </style>
  </head>

    <div id="root" inert aria-hidden="true" tabindex="-1"></div>
    <script>
      // Keep recovery available even if the application bundle fails to load.
      ;(() => {
        const splash = document.getElementById('club-launch')
        const message = document.getElementById('launch-message')
        const retry = document.getElementById('launch-retry')
        const open = document.getElementById('launch-open')
        const root = document.getElementById('root')
        let state = 'loading'
        retry.onclick = () => location.reload()
        open.onclick = () => {
          if (state !== 'ready') return
          state = 'opened'
          splash.hidden = true
          root.inert = false
          root.removeAttribute('aria-hidden')
          document.documentElement.classList.remove('club-launching')
          root.focus({ preventScroll: true })
        }
        const show = (text) => {
          splash.hidden = false
          root.inert = true
          root.setAttribute('aria-hidden', 'true')
          document.documentElement.classList.add('club-launching')
          open.hidden = true
          message.textContent = text
          retry.hidden = false
        }
        const timer = setTimeout(() => show('Загрузка занимает больше времени…'), 5000)
        window.clubLaunch = {
          fail(text) {
            clearTimeout(timer)
            state = 'failed'
            show(text)
          },
          finish() {
            clearTimeout(timer)
            if (state !== 'loading') return
            state = 'ready'
            message.textContent = 'Клуб готов'
            retry.hidden = true
            open.hidden = false
          },
        }
        window.addEventListener(
          'error',
          (event) => {
            if (event.target instanceof HTMLScriptElement && event.target.type === 'module')
              window.clubLaunch.fail('Не удалось загрузить приложение. Проверьте подключение.')
          },
          true,
        )
      })()
    </script>
    <script type="module">

      import('/src/launch-animation.ts').catch(() => {})
    </script>

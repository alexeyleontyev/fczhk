<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4eb" />
    <meta
      name="description"
      content="ФКЖК — футбол по пятницам: запись на игры, составы, результаты, рейтинги и прогнозы для участников сообщества."
    />
    <title>ФКЖК — футбол по пятницам</title>
    <link rel="icon" href="/assets/club/crest.svg" type="image/svg+xml" />
    <style>
      .club-launch {
        position: fixed;
        inset: 0;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 16px;
        overflow: auto;
        padding: 16px;
        background: #f7f4eb;
        color: #302d22;
        text-align: center;
        font:
          600 18px/1.35 system-ui,
          sans-serif;
      }
      .club-launch-flight {
        position: relative;
        width: min(72vw, 390px, 60vh);
        padding: 20px 0 38px;
      }
      .club-launch-drift {
        position: relative;
        z-index: 1;
        animation: club-launch-drift 4.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .club-launch img {
        display: block;
        width: 100%;
        height: auto;
        animation: club-launch-bob 2.4s ease-in-out infinite;
      }
      .club-launch-shadow {
        position: absolute;
        bottom: 9px;
        left: calc(50% - 43px);
        width: 86px;
        height: 9px;
        border-radius: 50%;
        background: #302d2226;
        filter: blur(5px);
        animation: club-launch-shadow 2.4s ease-in-out infinite;
      }
      @keyframes club-launch-drift {
        0%,
        100% {
          transform: translateX(-15px) rotate(-3deg);
        }
        50% {
          transform: translateX(15px) rotate(3deg);
        }
      }
      @keyframes club-launch-bob {
        0%,
        100% {
          transform: translateY(12px);
        }
        50% {
          transform: translateY(-12px);
        }
      }
      @keyframes club-launch-shadow {
        0%,
        100% {
          transform: scaleX(1.12);
          opacity: 0.65;
        }
        50% {
          transform: scaleX(0.78);
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .club-launch-drift,
        .club-launch img,
        .club-launch-shadow {
          animation: none;
        }
      }
      .club-launch p {
        margin: 0;
      }
      .club-launch[hidden] {
        display: none;
      }
      .club-launch button {
        cursor: pointer;
        font: inherit;
        color: inherit;
        background: transparent;
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="club-launch" id="club-launch">
      <div class="club-launch-flight" aria-hidden="true">
        <div class="club-launch-drift">
          <img src="/assets/club/vitaliy-drone-transparent.webp" width="700" height="572" alt="" />
        </div>
        <div class="club-launch-shadow"></div>
      </div>
      <p id="launch-message" role="status">Открываем клуб…</p>
      <button type="button" id="launch-retry" hidden>Повторить</button>
      <noscript>Для запуска приложения включите JavaScript.</noscript>
    </div>
    <div id="root"></div>
    <script>
      // Keep recovery available even if the application bundle fails to load.
      ;(() => {
        const splash = document.getElementById('club-launch')
        const message = document.getElementById('launch-message')
        const retry = document.getElementById('launch-retry')
        retry.onclick = () => location.reload()
        const show = (text) => {
          splash.hidden = false
          message.textContent = text
          retry.hidden = false
        }
        const timer = setTimeout(() => show('Загрузка занимает больше времени…'), 5000)
        window.clubLaunch = {
          fail(text) {
            clearTimeout(timer)
            show(text)
          },
          finish() {
            clearTimeout(timer)
            splash.hidden = true
          },
        }
        window.addEventListener(
          'error',
          (event) => {
            if (event.target instanceof HTMLScriptElement && event.target.type === 'module')
              window.clubLaunch.fail('Не удалось загрузить приложение. Проверьте подключение.')
          },
          true,
        )
      })()
    </script>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
